<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Premodern Elche - Fotos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="img/logo.png?v=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <!-- MENÚ DE NAVEGACIÓN -->
<!-- MENÚ DE NAVEGACIÓN -->
<header class="sticky top-0 z-40 w-full backdrop-blur-md border-b border-slate-800 bg-slate-950/90 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="img/logo.png" onerror="this.onerror=null; this.src='https://placehold.co/120x120/1e293b/d4af37?text=LPE';" class="h-10 w-10 rounded-full border border-amber-500/40">
                <span class="font-extrabold text-xl bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-500 bg-clip-text text-transparent">Liga Premodern Elche</span>
            </a>

            <!-- Botón Menú Hamburguesa para Móvil -->
            <button id="menu-btn" onclick="toggleMenu()" class="md:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <!-- Menú Escritorio -->
            <nav class="hidden md:flex space-x-1">
                <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800"><i class="fa-solid fa-house mr-2"></i>Inicio</a>
                <a href="clasificacion.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800"><i class="fa-solid fa-trophy mr-2"></i>Clasificación</a>
                <a href="fotos.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800"><i class="fa-solid fa-images mr-2"></i>Fotos</a>
                <a href="decks.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800"><i class="fa-solid fa-box-archive mr-2"></i>Decks</a>
            </nav>
        </div>

        <!-- Menú Desplegable Móvil -->
        <nav id="menu-movil" class="hidden md:hidden pb-4 pt-2 border-t border-slate-800 flex flex-col space-y-2">
            <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 flex items-center"><i class="fa-solid fa-house mr-3 w-5"></i>Inicio</a>
            <a href="clasificacion.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 flex items-center"><i class="fa-solid fa-trophy mr-3 w-5"></i>Clasificación</a>
            <a href="fotos.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 flex items-center"><i class="fa-solid fa-images mr-3 w-5"></i>Fotos</a>
            <a href="decks.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 flex items-center"><i class="fa-solid fa-box-archive mr-3 w-5"></i>Decks</a>
        </nav>
    </div>
</header>

    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        <h2 class="text-3xl font-bold text-amber-400 mb-6">Galería de Fotos</h2>
        
        <div id="photo-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-slate-500 text-xs">
        &copy; 2027 Liga Premodern Elche.
    </footer>

    <script>
        // Añade aquí las imágenes que tengas dentro de la carpeta "img/"
        const misFotos = [
          { url: 'img/fotos/foto1.jpg' },
          { url: 'img/fotos/foto2.jpg' },
          { url: 'img/fotos/foto3.jpg' },
          { url: 'img/fotos/foto4.jpg' },
          { url: 'img/fotos/foto5.jpg' },
          { url: 'img/fotos/foto6.jpg' }
        ];

        const grid = document.getElementById('photo-grid');
        misFotos.forEach(photo => {
            const div = document.createElement('div');
            div.className = 'overflow-hidden rounded-xl bg-slate-900 border border-slate-800 shadow-lg';
            div.innerHTML = `
                <img src="${photo.url}" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/d4af37?text=Sin+Imagen';" class="w-full h-56 object-cover">
                <div class="p-3"></div>
            `;
            grid.appendChild(div);
        });
    </script>
<script>
        function toggleMenu() {
            const menu = document.getElementById('menu-movil');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
